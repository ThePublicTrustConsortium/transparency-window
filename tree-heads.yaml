# SIGNED TREE HEADS - D-22 §3.
#
# APPEND ONLY. Each entry is a commitment, made at a moment, by a named key,
# to the exact contents of the decision log at a given size. Entries are never
# edited and never removed: a head that turned out to be wrong is corrected by
# appending a later head, not by rewriting an earlier one. Editing an entry here
# does not fix a mistake, it destroys the evidence of one.
#
# WHAT A SIGNATURE HERE CLAIMS. The log-operator key lives in this machine's TPM
# behind Windows Hello and is non-exportable. Every signature below required a
# live biometric gesture from the operator at the moment it was made. So an
# entry claims: a person committed to this root, at this size, at this time.
# It does NOT claim the decisions themselves are right, or that anyone else
# has agreed - see countersignatures.
#
# COUNTERSIGNATURES are present from birth and honestly empty. External
# overseers do not exist yet; the field is not a promise that they will, it is
# the shape their agreement will take when they do. An empty list is the true
# answer to "who else has vouched for this?" and D-22 §9 requires the true
# answer rather than the flattering one.
#
# THE COUNTERSIGNATURE FORMAT, defined now so a seat can be filled without
# renegotiating the schema:
#
#     - keyId:      lowercase hex SHA-256 of the overseer's DER SPKI
#       algorithm:  e.g. rsa2048-pkcs1v15-sha256 or ecdsa-p256-sha256
#       signature:  base64, over THE IDENTICAL canonical STH bytes the operator
#                   signed — the same five-line PTC-STH-v1 serialization, not a
#                   re-encoding, so one definition serves both roles
#       timestamp:  ISO 8601 UTC seconds, when the overseer signed
#       overseer:   the seat's name as admitted to the record
#
# Countersigning the SAME BYTES is what makes the two signatures comparable: an
# overseer who signed a different serialization would be vouching for a different
# statement, and the difference would be invisible in a list of base64.
#
# An overseer key is admitted by a decision-log entry, never by appearing in a
# directory — see keys/overseers/README.md. The seat is filled on the record or
# it is not filled.
#
# THE CANONICAL SIGNED BYTES, so a verifier can reimplement without this repo:
#
#     "PTC-STH-v1" LF {treeSize} LF {rootHash} LF {timestamp} LF {keyId} LF
#
# Five LF-terminated lines, INCLUDING THE LAST. treeSize decimal; rootHash and
# keyId lowercase hex; timestamp ISO 8601 UTC seconds with a literal Z. keyId is
# SHA-256 of the DER SubjectPublicKeyInfo in keys/ptc-log-operator-1.spki.pem.
# Algorithm rsa2048-pkcs1v15-sha256: the signature is RSASSA-PKCS1-v1_5 over SHA-256 of
# those bytes, so verification hashes the message itself - it is not a signature
# over a pre-computed digest.
#
# Generated and appended by scripts/log/sign-head.mjs, which refuses to write an
# entry whose signature it cannot verify locally first.

