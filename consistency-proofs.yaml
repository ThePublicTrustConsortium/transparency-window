# CONSISTENCY PROOFS — RFC 6962 §2.1.2, D-22 §3.
#
# One entry per ADJACENT pair of signed tree heads. Each proves that the earlier
# head's tree is a PREFIX of the later one's: no leaf moved, none was removed,
# none was edited.
#
# WHY THIS FILE EXISTS. A signature proves a key committed to a root. It does not
# prove the trees are related. The same key could sign two unrelated trees, or a
# tree whose history had been quietly rewritten, and every signature would still
# verify. Until these proofs were published, "append-only" was a claim backed by
# our process — which D-22 §9 requires be LABELLED as such rather than asserted.
# It is now checkable arithmetic, and the label has been removed because the gap
# has been closed, not because it became inconvenient.
#
# VERIFY WITHOUT US. Given fromSize, toSize, the two roots from tree-heads.yaml,
# and this node list, the RFC 6962 verification algorithm rebuilds both roots.
# Nothing here requires the decision log itself, which is the point: the window
# shows the commitments are consistent without showing what they commit to.
#
# ADJACENT ONLY, deliberately. Chaining 1→2→3→4 proves what 1→4 proves and also
# shows WHICH append broke the chain if one ever does.
#
# NODE ORDER IS LOAD-BEARING. The verifier consumes this list from the front; a
# reversed list verifies against nothing. tests/consistency.test.ts asserts that
# explicitly, against the RFC's own published vectors.
#
# Generated by scripts/log/build-consistency.mjs, which refuses to write a proof
# it cannot verify itself first.

